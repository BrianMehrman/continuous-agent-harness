plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

group = 'com.brianmehrman'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.ai:spring-ai-ollama'
    implementation 'io.temporal:temporal-sdk:1.36.1'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.temporal:temporal-testing:1.36.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking { lockAllConfigurations() }

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = true
    filter { failOnNoMatchingTests = true }
}

tasks.named('test', Test) {
    exclude '**/*IT.class'
}

def integrationTest = tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against PostgreSQL and Temporal.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/*IT.class'
    shouldRunAfter tasks.named('test')
    systemProperty 'runner.test.classpath', sourceSets.test.runtimeClasspath.asPath
}

tasks.named('check') { dependsOn integrationTest }
tasks.named('jar') { enabled = false }

// Trusted benchmark assets travel with the application; generated outputs never do.
tasks.named('processResources') {
    from('benchmarks/task-tracker-v1/starter') {
        into 'benchmarks/task-tracker-v1/starter'
        exclude 'build/**', '.gradle/**'
        eachFile {
            def cursor = file.toPath()
            while (cursor != null) {
                if (java.nio.file.Files.isSymbolicLink(cursor)) {
                    throw new GradleException('Benchmark assets must not contain symbolic links')
                }
                cursor = cursor.parent
            }
        }
    }
}
