# Copy these settings into local application configuration before selecting a profile.
# HARNESS_OLLAMA_MODEL must be set explicitly to an installed local tag.
harness:
  model:
    # Anthropic keys live here, outside Spring's .secrets/app configtree.
    secrets-directory: ./.secrets/models/
    ollama:
      endpoint: http://127.0.0.1:11434
    context-tokens: 8192
    output-tokens: 1024
    temperature: 0.0
  # Bind the developer role to a saved profile revision to omit profileRevision from a run request.
  # roles:
  #   developer:
  #     profile: <profile-id-from-probe>
