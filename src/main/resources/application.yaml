spring:
  config:
    import: optional:configtree:${HARNESS_SECRETS_DIR:./.secrets/app/}
  application:
    name: continuous-agent-harness
  profiles:
    default: api
  datasource:
    url: ${HARNESS_DB_URL:jdbc:postgresql://127.0.0.1:55432/harness}
    username: ${HARNESS_DB_USER:harness}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
server:
  address: 127.0.0.1
  port: ${HARNESS_HTTP_PORT:8080}
management:
  tracing:
    export:
      otlp:
        enabled: ${HARNESS_OTLP_TRACES_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${HARNESS_OTLP_METRICS_ENABLED:false}
        url: ${HARNESS_OTLP_METRICS_URL:http://127.0.0.1:4318/v1/metrics}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${HARNESS_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
harness:
  model:
    secrets-directory: ${HARNESS_MODEL_SECRETS_DIR:./.secrets/models/}
  runner:
    enabled: ${HARNESS_RUNNER_ENABLED:false}
    image: ${HARNESS_RUNNER_IMAGE:}
    repository-image: ${HARNESS_REPOSITORY_RUNNER_IMAGE:}
  temporal:
    target: ${HARNESS_TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: ${HARNESS_TEMPORAL_NAMESPACE:harness}
    task-queue: ${HARNESS_TEMPORAL_TASK_QUEUE:coding-v1}
    build-id: ${HARNESS_WORKER_BUILD_ID:}
---
spring:
  config:
    activate:
      on-profile: worker | runner
  main:
    web-application-type: none
    keep-alive: true
